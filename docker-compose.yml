version: '3.8'

services:
  glossary-ai-web-frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TS_WEBAPP_BUILD_VARIANT: ${TS_WEBAPP_BUILD_VARIANT}
        TS_WEBAPP_PROXY_CONNECTION_STRING: ${TS_WEBAPP_PROXY_CONNECTION_STRING}
    container_name: glossaryai-webapp
    image: glossary-ai-web-frontend:2026.01.07.1
    restart: always

  glossary-ai-web-nginx:
    image: nginx:1.25.4-alpine
    container_name: glossaryai-webapp-nginx-2026-01-07-1
    restart: always
    ports:
      - "13000:13000"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - glossary-ai-web-frontend
